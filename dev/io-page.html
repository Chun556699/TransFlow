<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>TransFlow input/video test</title></head>
  <body style="font-family: Georgia, serif; max-width: 720px; margin: 40px auto">
    <h2>Input auto-direction</h2>
    <input id="zh" type="text" style="width: 100%; padding: 8px" />
    <textarea id="en" style="width: 100%; height: 60px; margin-top: 12px"></textarea>
    <h2>Generic video</h2>
    <div id="vbox" style="width: 640px; height: 360px; background: #111">
      <video id="v" width="640" height="360" controls>
        <track kind="subtitles" srclang="en" label="English" src="subs.vtt" default />
      </video>
    </div>
  </body>
</html>
