name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: node --check built bundles
        run: |
          for f in dist/chrome/background.js dist/chrome/content.js dist/firefox/background.js dist/firefox/content.js; do
            node --check "$f"
          done
